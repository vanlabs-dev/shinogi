schema: spec-driven

context: |
  subnt is the public static dump for https://subnt.dev.
  Atlas (~/src/github/vanlabs-dev/atlas) is the worker. This repo
  holds index.html and 404.html. No chain calls, keys, or backend here.
  Cloudflare Workers static hosting: blank build command, deploy command
  npx wrangler deploy, production branch main. Cadence 6h.
  v1 is one self-contained HTML view: public pulse. No nav, accounts,
  or articles. Compose from Atlas briefing store facts, not LAN boards.
  Off the page: wallets, keys, Telegram, Pi address, TaoStats quota,
  exploit paths, mining.budget_band, atlas/operator section.
  Gaps named, never estimated. No em dashes. IntoTAO is reference only.
  v2 (branch v2, change subnt-v2): Astro static build, build command
  npm ci && npm run build, output dist/. Atlas writes data/*.json against
  schema/subnt-1.0.json; this repo never writes data/ and computes no
  figure. No browser data fetch, no Worker or server code.
  Author: vanlabs-dev <vanlabs@pm.me>. Never add Co-Authored-By.

rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a Non-goals section
  specs:
    - Requirements describe the published HTML contract, not Atlas internals
  design:
    - Renderer stays in Atlas. This repo specifies the page and holds the published edition
  tasks:
    - "Tasks in this repo are the contract HTML and living docs. Do not implement the Atlas renderer here."

operations:
  apply:
    guidance:
      - Do not add custom backend/Worker code, a Function, or JS data fetch; Workers static hosting is allowed
      - Do not copy LAN board chrome
      - Never write data/ from this repo; fixtures live in tests/fixtures/
      - Subscriber blocks carry shape only; real figures never enter this repo
  archive:
    guidance:
      - Summarize the archive outcome before finishing
